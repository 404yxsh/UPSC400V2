name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Fail if the merged manifest contains the INTERNET permission
        run: |
          MANIFEST=$(find app/build/intermediates -name 'AndroidManifest.xml' -path '*merged_manifest*' | head -n 1)
          echo "Checking $MANIFEST"
          test -n "$MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo 'INTERNET permission found in merged manifest'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: upsc400-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
